<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan 5 - Aplikasi To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            font-size: 20px;
            font-weight: normal;
            margin-bottom: 25px;
        }

        #output5 {
            display: inline-block;
            text-align: left;
        }

        #task-input {
            padding: 5px;
            width: 200px;
        }

        #add-task {
            padding: 5px 12px;
            cursor: pointer;
            margin-left: 5px;
        }

        #task-list {
            padding-left: 0;
            margin-top: 20px;
            list-style: none;
        }

        #task-list li {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #task-list button {
            padding: 2px 8px;
            cursor: pointer;
            margin-left: auto;
        }
    </style>
</head>
<body>

    <h1>Latihan 5: Aplikasi To-Do List</h1>
    
    <div id="output5"></div>

    <script src="todolist.js"></script>
</body>
</html>
